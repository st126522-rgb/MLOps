name: Deploy NER Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest pipeline/tests/ -v --cov=pipeline --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: terraform/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="s3_bucket_name=${{ secrets.S3_BUCKET }}" \
            -var="key_pair_name=ci-keypair" \
            -out=tfplan
        env:
          TF_VAR_environment: dev

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Save EC2 IP to output
        id: ec2_ip
        run: echo "ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy Pipeline Code to EC2
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/deploy_key.pem
          chmod 600 /tmp/deploy_key.pem

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          rsync -avz \
            -e "ssh -i /tmp/deploy_key.pem -o StrictHostKeyChecking=no" \
            ./pipeline/ \
            ubuntu@$EC2_HOST:/opt/ai-news-ner/pipeline/

          ssh -i /tmp/deploy_key.pem \
              -o StrictHostKeyChecking=no \
              ubuntu@$EC2_HOST << 'ENDSSH'
            set -e
            cd /opt/ai-news-ner
            source venv/bin/activate
            pip install -r pipeline/requirements.txt --quiet
            python pipeline/dashboard.py --dir local_data || true
            echo "Deployment complete at $(date)"
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/deploy_key.pem

  evaluate:
    name: NER Model Evaluation Gate
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Run evaluation
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: python pipeline/eval.py --bucket $S3_BUCKET --upload-results

      - name: Check F1 gate
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: python pipeline/eval.py --check-gate --bucket $S3_BUCKET

      - name: Upload eval results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ github.sha }}
          path: eval_results.json