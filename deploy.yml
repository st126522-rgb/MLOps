###############################################################
# .github/workflows/deploy.yml
#
# CI/CD PIPELINE — what happens on every git push to main:
#
#   Job 1: test       → run unit tests locally in GitHub runner
#   Job 2: terraform  → plan + apply infrastructure changes
#   Job 3: deploy     → SSH into EC2, pull latest code, restart pipeline
#   Job 4: eval       → run NER eval script, upload F1 results to S3
#
# REQUIRED GITHUB SECRETS (Settings → Secrets → Actions):
#   AWS_ACCESS_KEY_ID       ← IAM user with S3 + EC2 permissions
#   AWS_SECRET_ACCESS_KEY   ← IAM user secret
#   EC2_HOST                ← your EC2 public IP (update after terraform apply)
#   EC2_SSH_KEY             ← contents of your .pem file
#   S3_BUCKET               ← your bucket name
###############################################################

name: Deploy NER Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: "3.11"

jobs:

  # ────────────────────────────────────────────────────────
  # JOB 1: TEST
  # Runs fast unit tests on every push, including PRs
  # Does NOT require AWS credentials
  # ────────────────────────────────────────────────────────
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov
          pip install boto3 networkx spacy
          python -m spacy download en_core_web_sm --quiet

      - name: Run tests
        run: pytest pipeline/tests/ -v --cov=pipeline --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  # ────────────────────────────────────────────────────────
  # JOB 2: TERRAFORM
  # Runs only on push to main (not on PRs — safety)
  # Plans on PR, applies on merge to main
  # ────────────────────────────────────────────────────────
  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: terraform/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check
        continue-on-error: true   # warn but don't fail on formatting

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="s3_bucket_name=${{ secrets.S3_BUCKET }}" \
            -var="key_pair_name=ci-keypair" \
            -out=tfplan
        env:
          TF_VAR_environment: dev

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Save EC2 IP to output
        id: ec2_ip
        run: echo "ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT

  # ────────────────────────────────────────────────────────
  # JOB 3: DEPLOY PIPELINE CODE
  # SSHes into EC2, pulls latest code, restarts services
  # ────────────────────────────────────────────────────────
  deploy:
    name: Deploy Pipeline Code to EC2
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/deploy_key.pem
          chmod 600 /tmp/deploy_key.pem

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          # Copy updated pipeline code to EC2
          rsync -avz \
            -e "ssh -i /tmp/deploy_key.pem -o StrictHostKeyChecking=no" \
            ./pipeline/ \
            ubuntu@$EC2_HOST:/opt/ai-news-ner/pipeline/

          # SSH in and restart the pipeline
          ssh -i /tmp/deploy_key.pem \
              -o StrictHostKeyChecking=no \
              ubuntu@$EC2_HOST << 'ENDSSH'
            set -e
            cd /opt/ai-news-ner
            source venv/bin/activate

            # Install any new dependencies
            pip install -r pipeline/requirements.txt --quiet

            # Restart Streamlit dashboard (if running)
            pkill -f streamlit || true
            nohup streamlit run pipeline/dashboard.py \
              --server.port 8501 \
              --server.headless true \
              > /var/log/streamlit.log 2>&1 &

            echo "Deployment complete at $(date)"
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/deploy_key.pem

  # ────────────────────────────────────────────────────────
  # JOB 4: MODEL EVALUATION GATE
  # Runs eval on latest model artifacts in S3
  # Uploads results to S3 eval/
  # Fails the pipeline if F1 regresses
  # ────────────────────────────────────────────────────────
  evaluate:
    name: NER Model Evaluation Gate
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install boto3 transformers torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run evaluation
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: python pipeline/eval.py --bucket $S3_BUCKET --upload-results

      - name: Check F1 gate
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          # eval.py exits with code 1 if new model F1 < current production F1
          # GitHub Actions will mark this step FAILED and block deployment
          python pipeline/eval.py --check-gate --bucket $S3_BUCKET

      - name: Upload eval results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ github.sha }}
          path: eval_results.json
